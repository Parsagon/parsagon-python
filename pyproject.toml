[build-system]
requires = [
    "setuptools>=82.0.1",
    "wheel"
]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
parsagon = ["highlights.js", "loading.gif"]

[tool.black]
line-length = 120

[project]
name = "parsagon"
version = "1.0.1"
description = "Allows you to create browser automations with natural language"
readme = "README.md"
requires-python = ">=3.10"
authors = [
  { name="Sandy Suh", email="sandy@parsagon.io" },
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]

dependencies = [
    'selenium == 4.44.0',
    'seleniumbase == 4.49.10',
    'lxml[html_clean] == 5.3.2',
    'httpx >= 0.27.0',
    'psutil == 7.2.2',
    'rich == 15.0.0',

    # Used only in pipeline code execution
    'PyVirtualDisplay==3.0',
    'selenium-wire==5.1.0',
    'cssselect==1.4.0',
    'webdriver-manager==4.0.2',
    'jsonpath-ng==1.5.3',
    'simplejson==3.19.1',
    'PyMuPDF==1.26.4',
    'pymupdf4llm==0.0.27',
    'pypdf==5.9.0',
    'python-dateutil==2.9.0.post0',
    'html2text==2024.2.26',
    'feedparser==6.0.11',
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0.3",
    "pytest-mock>=3.11.1",
    "pre-commit==3.6.0"
]

[project.urls]
"Homepage" = "https://parsagon.io"

[project.scripts]
parsagon = "parsagon.main:main"
